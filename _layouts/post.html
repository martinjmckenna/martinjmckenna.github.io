---
layout: default
---

<article>
  <header>
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  {{ content }}

  <nav class="post-nav">
    {% if page.previous.url %}
      <a class="prev" href="{{ page.previous.url | relative_url }}">{{ page.previous.title }}</a>
    {% else %}
      <span></span>
    {% endif %}
    {% if page.next.url %}
      <a class="next" href="{{ page.next.url | relative_url }}">{{ page.next.title }}</a>
    {% endif %}
  </nav>
</article>
